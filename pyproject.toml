[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofforge"
version = "0.1.3.1"
description = "Offline-first evidence packaging and verification for authorized security disclosures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
proofforge = "proofforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
